<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb Ring Mission: Celebrations</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Lexend,"Trebuchet MS",Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#111a4a 0%,#3b2a86 55%,#8e4ddb 120%);min-height:100vh}
body.hc{background:#000}
button{font:inherit;cursor:pointer}
#app{max-width:980px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.tools button,.lv button{background:#e3e7ee;color:#14141f;border:2px solid #35c7f2;border-radius:999px;padding:8px 16px;font-weight:700;min-height:44px}
.tools button[aria-pressed=true],.lv button.on{background:#ffc93c}
.meter{display:flex;gap:8px;align-items:center}
.slot{width:34px;height:46px;border-radius:7px;border:2px dashed #cfd6ff;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.slot.on{border:2px solid #35c7f2;border-style:solid;background:linear-gradient(160deg,#1b3a8c,#8e4ddb)}
.panel{background:#fff;color:#14141f;border-radius:18px;padding:24px;margin-top:16px}
.panel h2{margin:0 0 8px;color:#1b3a8c;font-size:28px}
.q{font-size:30px;font-weight:700;margin:12px 0 18px;line-height:1.3}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.opt{background:#e7eefc;border:3px solid #1b3a8c;border-radius:14px;padding:16px;font-size:22px;font-weight:700;color:#14141f;min-height:64px}
.opt:hover{background:#cfe0ff}
.opt.bad{background:#fde1e5;border-color:#c8102e;color:#7a0a1c;text-decoration:line-through}
.opt.good{background:#d6f5df;border-color:#1a7f3c}
.btn{background:#c8102e;color:#fff;border:3px solid #35c7f2;border-radius:999px;padding:14px 30px;font-size:20px;font-weight:700;min-height:48px}
.btn.alt{background:#fff;color:#14141f}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.msg{font-size:20px;font-weight:700;min-height:30px;margin-top:12px}
.hint{color:#555;font-size:18px;margin-top:8px}
.bar{height:12px;background:rgba(255,255,255,.2);border-radius:99px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:#35c7f2;transition:width .4s}
.answer{min-height:64px;border:3px dashed #1b3a8c;border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.word{background:#ffc93c;border:2px solid #14141f;border-radius:10px;padding:10px 14px;font-size:22px;font-weight:700;color:#14141f;min-height:48px}
.card{width:150px;height:210px;border-radius:16px;border:4px solid #35c7f2;background:linear-gradient(160deg,#1b3a8c,#8e4ddb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:22px;margin:0 auto;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.center{text-align:center}
.glow{filter:drop-shadow(0 0 14px #35c7f2)}
:focus-visible{outline:4px solid #ffc93c;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand"><span id="logo"></span>Orb Ring Mission</div>
    <div class="meter" id="meter" aria-label="Fusion Card meter"></div>
    <div class="tools">
      <button id="bMute" aria-pressed="false">Sound on</button>
      <button id="bHc" aria-pressed="false">High contrast</button>
    </div>
  </div>
  <div id="stage"></div>
</div>
<script>
var RING = function (s, c) {
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 100 100" aria-hidden="true" class="' + (c || '') + '"><circle cx="50" cy="50" r="38" fill="none" stroke="#35c7f2" stroke-width="9"/><circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="2" opacity=".7"/><circle cx="50" cy="50" r="12" fill="#c8102e"/></svg>';
};
var MISSIONS = [
  { n: 'Date Defender', card: 'Date', intro: 'Say the dates in words to charge the ring.', partner: 'Ask your Ring Partner: When’s your birthday?',
    qs: [
      { q: 'Say 3rd in words.', a: 'third', d: ['thirteenth', 'tenth', 'fourth'], h: 'Starts with th. It comes after second.' },
      { q: 'Say 12th in words.', a: 'twelfth', d: ['twelve', 'twentieth', 'second'], h: 'Twelve + th, but the v changes.' },
      { q: 'Say 21st in words.', a: 'twenty-first', d: ['twelfth', 'twenty-one', 'first'], h: 'Twenty + first.' },
      { q: 'When’s your birthday?', a: 'It’s on 13 September.', d: ['It’s 3 November today.', 'I’m going to a party.', 'I’m from Mexico.'], h: 'A birthday answer gives a date.' }
    ] },
  { n: 'Costume Quest', card: 'Costume', intro: 'Use “be going to” to choose the right costume plan.', partner: 'Ask your Ring Partner: What are you going to dress up as?',
    qs: [
      { q: 'I’m going ___ dress up as a nurse.', a: 'to', d: ['for', 'at', 'in'], h: 'Going + ___ + verb.' },
      { q: 'She ___ going to be a scout.', a: 'is', d: ['am', 'are', 'be'], h: 'She goes with is.' },
      { q: 'We ___ going to watch the parade.', a: 'are', d: ['is', 'am', 'be'], h: 'We goes with are.' },
      { q: 'What are you going to dress up as?', a: 'I’m going to be a soldier.', d: ['I’m a soldier yesterday.', 'I went to be a soldier.', 'I going to soldier.'], h: 'Look for “I’m going to be”.' }
    ] },
  { n: 'Celebration Scout', card: 'Scout', intro: 'Find the celebration words.', partner: 'Tell your Ring Partner about one special day you love.',
    qs: [
      { q: 'People watch these in the sky on New Year’s Day.', a: 'fireworks', d: ['costumes', 'a parade', 'a diary'], h: 'They are bright and loud.' },
      { q: 'You ___ the house before a party.', a: 'decorate', d: ['stay up', 'borrow', 'fish'], h: 'Balloons and lights help.' },
      { q: 'Not going to bed early means you...', a: 'stay up', d: ['dress up', 'decorate', 'go to school'], h: 'You stay awake late.' },
      { q: 'Which one is a celebration?', a: 'Independence Day', d: ['Maths homework', 'A rainy day', 'A school bag'], h: 'There is a parade.' }
    ] },
  { n: 'Diary Hero', card: 'Diary', intro: 'Tap the words in the right order to build each diary sentence.', partner: 'Read your diary sentence to your Ring Partner.', order: true,
    qs: [
      { s: 'Tomorrow is a special day.' },
      { s: 'I’m going to have a party.' },
      { s: 'We’re going to decorate the house.' },
      { s: 'I’m not going to go to bed early.' }
    ] }
];
var LEVELS = { Light: 2, Fusion: 3, Origin: 4 };
var S = { lv: 'Fusion', m: 0, q: 0, pts: 0, cards: [], tries: 0, muted: false, built: [], pool: [] };
var stage = document.getElementById('stage');
var ac = null;

document.getElementById('logo').innerHTML = RING(34);

function beep(f, d) {
  if (S.muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; o.type = 'sine'; g.gain.value = 0.08;
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function say(t) {
  if (S.muted || !window.speechSynthesis) return;
  try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = 0.85; speechSynthesis.speak(u); } catch (e) {}
}
function shuffle(a) {
  a = a.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function meter() {
  var h = '';
  ['Date', 'Costume', 'Scout', 'Diary'].forEach(function (c) {
    h += '<div class="slot' + (S.cards.indexOf(c) > -1 ? ' on' : '') + '" title="' + c + '">' + (S.cards.indexOf(c) > -1 ? c[0] : '') + '</div>';
  });
  h += '<span style="font-size:15px">' + S.cards.length + ' / 4</span>';
  document.getElementById('meter').innerHTML = h;
}
function home() {
  meter();
  stage.innerHTML = '<div class="panel center"><div class="glow">' + RING(150) + '</div>' +
    '<h2>Orb Ring Mission: Celebrations</h2>' +
    '<p style="font-size:20px;margin:6px 0">The Orb Ring has lost its light! Win four Fusion Cards to bring it back.</p>' +
    '<p style="font-size:18px;margin:14px 0 6px"><b>Choose your level</b></p>' +
    '<div class="lv row" style="justify-content:center">' +
    Object.keys(LEVELS).map(function (l) { return '<button data-l="' + l + '" class="' + (S.lv === l ? 'on' : '') + '">' + l + '</button>'; }).join('') + '</div>' +
    '<p class="hint" id="lvInfo"></p>' +
    '<div class="row" style="justify-content:center"><button class="btn" id="go">START MISSION</button></div></div>';
  var info = { Light: 'Light: 2 choices and hints shown for you.', Fusion: 'Fusion: 3 choices. Use the hint button if you need it.', Origin: 'Origin: 4 choices. Hints cost points.' };
  function upd() {
    document.getElementById('lvInfo').textContent = info[S.lv];
    document.querySelectorAll('.lv button').forEach(function (b) { b.classList.toggle('on', b.dataset.l === S.lv); });
  }
  upd();
  document.querySelectorAll('.lv button').forEach(function (b) { b.onclick = function () { S.lv = b.dataset.l; upd(); }; });
  document.getElementById('go').onclick = function () { S.m = 0; S.q = 0; S.pts = 0; S.cards = []; mission(); };
}
function mission() {
  meter();
  var m = MISSIONS[S.m];
  stage.innerHTML = '<div class="panel"><h2>Mission ' + (S.m + 1) + ': ' + m.n + '</h2><p style="font-size:20px;margin:0">' + m.intro + '</p>' +
    '<div class="row"><button class="btn" id="st">Begin</button></div></div>';
  document.getElementById('st').onclick = function () { S.q = 0; question(); };
}
function question() {
  var m = MISSIONS[S.m], q = m.qs[S.q];
  S.tries = 0;
  if (m.order) return orderQ(m, q);
  var n = LEVELS[S.lv];
  var opts = shuffle([q.a].concat(shuffle(q.d).slice(0, n - 1)));
  stage.innerHTML = '<div class="panel"><div style="display:flex;justify-content:space-between;font-weight:700;color:#1b3a8c"><span>' + m.n + '</span><span>Question ' + (S.q + 1) + ' / 4 · ' + S.pts + ' points</span></div>' +
    '<div class="bar"><i style="width:' + (S.q / 4 * 100) + '%"></i></div>' +
    '<div class="q" id="qt">' + esc(q.q) + '</div>' +
    '<div class="row" style="margin:0 0 14px"><button class="btn alt" id="sp">Listen</button><button class="btn alt" id="hb">Hint</button></div>' +
    '<div class="hint" id="hint">' + (S.lv === 'Light' ? 'Hint: ' + esc(q.h) : '') + '</div>' +
    '<div class="opts" id="opts">' + opts.map(function (o) { return '<button class="opt">' + esc(o) + '</button>'; }).join('') + '</div>' +
    '<div class="msg" id="msg" aria-live="polite"></div></div>';
  document.getElementById('sp').onclick = function () { say(q.q); };
  document.getElementById('hb').onclick = function () {
    document.getElementById('hint').textContent = 'Hint: ' + q.h;
    if (S.lv === 'Origin') S.pts = Math.max(0, S.pts - 2);
  };
  document.querySelectorAll('.opt').forEach(function (b) {
    b.onclick = function () {
      var msg = document.getElementById('msg');
      if (b.textContent === q.a) {
        S.pts += S.tries === 0 ? 10 : 5;
        b.classList.add('good'); beep(880, .25); say(b.textContent);
        msg.textContent = 'Power up! The ring is charging.';
        document.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; });
        setTimeout(next, 1300);
      } else {
        S.tries++; b.classList.add('bad'); b.disabled = true; beep(220, .25);
        msg.textContent = 'Try again. You can do it!';
        document.getElementById('opts').classList.remove('shake'); void document.getElementById('opts').offsetWidth; document.getElementById('opts').classList.add('shake');
      }
    };
  });
}
function orderQ(m, q) {
  var words = q.s.split(' ');
  S.built = []; S.pool = shuffle(words.map(function (w, i) { return { w: w, i: i }; }));
  function draw() {
    stage.innerHTML = '<div class="panel"><div style="display:flex;justify-content:space-between;font-weight:700;color:#1b3a8c"><span>' + m.n + '</span><span>Sentence ' + (S.q + 1) + ' / 4 · ' + S.pts + ' points</span></div>' +
      '<div class="bar"><i style="width:' + (S.q / 4 * 100) + '%"></i></div>' +
      '<div class="q">Build the sentence.</div>' +
      '<div class="answer" id="ans" aria-label="Your sentence">' + S.built.map(function (x, k) { return '<button class="word" data-k="' + k + '">' + esc(x.w) + '</button>'; }).join('') + '</div>' +
      '<div class="row" style="margin:0 0 14px">' + S.pool.map(function (x, k) { return '<button class="word" data-p="' + k + '">' + esc(x.w) + '</button>'; }).join('') + '</div>' +
      '<div class="row"><button class="btn alt" id="hb">Hint</button><button class="btn alt" id="cl">Clear</button><button class="btn" id="ck">Check</button></div>' +
      '<div class="hint" id="hint">' + (S.lv === 'Light' ? 'Hint: it starts with “' + esc(words[0]) + '”.' : '') + '</div>' +
      '<div class="msg" id="msg" aria-live="polite"></div></div>';
    document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { S.built.push(S.pool.splice(+b.dataset.p, 1)[0]); draw(); }; });
    document.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { S.pool.push(S.built.splice(+b.dataset.k, 1)[0]); draw(); }; });
    document.getElementById('cl').onclick = function () { S.pool = S.pool.concat(S.built); S.built = []; draw(); };
    document.getElementById('hb').onclick = function () {
      document.getElementById('hint').textContent = 'Hint: it starts with “' + words.slice(0, 2).join(' ') + '”.';
      if (S.lv === 'Origin') S.pts = Math.max(0, S.pts - 2);
    };
    document.getElementById('ck').onclick = function () {
      var msg = document.getElementById('msg');
      var got = S.built.map(function (x) { return x.w; }).join(' ');
      if (got === q.s) {
        S.pts += S.tries === 0 ? 10 : 5; beep(880, .25); say(q.s);
        msg.textContent = 'Power up! ' + q.s; setTimeout(next, 1800);
      } else {
        S.tries++; beep(220, .25); msg.textContent = 'Not yet. Check the order and try again.';
      }
    };
  }
  draw();
}
function next() {
  S.q++;
  if (S.q < 4) return question();
  var m = MISSIONS[S.m];
  S.cards.push(m.card); meter(); beep(660, .15); setTimeout(function () { beep(990, .3); }, 180);
  stage.innerHTML = '<div class="panel center"><h2>Mission complete!</h2>' +
    '<div class="card"><span style="font-size:15px;color:#cfd6ff">FUSION CARD</span>' + m.card + '</div>' +
    '<p style="font-size:20px;margin:16px 0 0"><b>Ring Partner task:</b> ' + m.partner + '</p>' +
    '<div class="row" style="justify-content:center"><button class="btn" id="nx">' + (S.m < 3 ? 'Next mission' : 'FUSION UP!') + '</button></div></div>';
  document.getElementById('nx').onclick = function () { if (S.m < 3) { S.m++; mission(); } else finish(); };
}
function finish() {
  meter();
  var rank = S.pts >= 130 ? 'Origin Hero' : S.pts >= 90 ? 'Fusion Ranger' : 'Light Seeker';
  [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { beep(f, .3); }, i * 200); });
  stage.innerHTML = '<div class="panel center"><div class="glow">' + RING(170) + '</div>' +
    '<h2>Fusion Up! The ring is shining again!</h2>' +
    '<p style="font-size:22px;margin:8px 0"><b>' + S.pts + ' points</b> · Rank: <b>' + rank + '</b></p>' +
    '<p style="font-size:18px;margin:0">Level: ' + S.lv + ' · Cards: Date, Costume, Scout, Diary</p>' +
    '<div class="row" style="justify-content:center"><button class="btn" id="again">Play again</button><button class="btn alt" id="home">Change level</button></div></div>';
  document.getElementById('again').onclick = function () { S.m = 0; S.q = 0; S.pts = 0; S.cards = []; mission(); };
  document.getElementById('home').onclick = function () { S.cards = []; home(); };
}
document.getElementById('bMute').onclick = function (e) {
  S.muted = !S.muted; e.target.setAttribute('aria-pressed', S.muted); e.target.textContent = S.muted ? 'Sound off' : 'Sound on';
  if (S.muted && window.speechSynthesis) speechSynthesis.cancel();
};
document.getElementById('bHc').onclick = function (e) {
  var on = document.body.classList.toggle('hc'); e.target.setAttribute('aria-pressed', on);
};
home();
</script>
</body>
</html>
